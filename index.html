<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Secure SafeLink Redirect</title>

<meta name="description" content="Secure redirect system to safely navigate users to external links.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#020617">

<link rel="dns-prefetch" href="https://external.beritanasional.eu.org">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/score808pages/football808@main/image/livescore%20808.png">

<!-- MGID -->
<script src="https://jsc.mgid.com/site/829703.js" async></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:'Segoe UI',system-ui,sans-serif;
background:radial-gradient(circle at top,#1e3a8a,#020617);
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
color:#fff;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,0.1);
width:100%;
max-width:420px;
border-radius:20px;
padding:28px;
box-shadow:0 20px 80px rgba(0,0,0,.6);
text-align:center;
position:relative;
overflow:hidden;
}

/* GLOW */
.card::before{
content:"";
position:absolute;
width:200px;
height:200px;
background:radial-gradient(circle,#3b82f6,transparent);
top:-50px;
right:-50px;
opacity:.4;
}

/* TEXT */
.title{
font-size:20px;
font-weight:800;
margin-bottom:6px;
}

.small{
font-size:13px;
color:#cbd5f5;
}

/* LOADER */
.loader{
width:60px;
height:60px;
border-radius:50%;
border:4px solid rgba(255,255,255,.2);
border-top:4px solid #60a5fa;
animation:spin .9s linear infinite;
margin:22px auto;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

/* PROGRESS */
.progress{
height:6px;
background:rgba(255,255,255,.1);
border-radius:20px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#3b82f6,#22d3ee);
transition:width .4s ease;
}

/* DOMAIN */
.domain{
font-size:13px;
color:#93c5fd;
margin-top:10px;
word-break:break-all;
}

/* BUTTON */
.btn{
display:block;
margin-top:18px;
padding:14px;
background:linear-gradient(90deg,#2563eb,#3b82f6);
color:#fff;
border-radius:12px;
text-decoration:none;
font-weight:700;
opacity:.4;
pointer-events:none;
transition:.3s;
}

.btn.active{
opacity:1;
pointer-events:auto;
}

/* COUNT */
.count{
font-weight:800;
color:#60a5fa;
}

/* ADS */
.ads{
min-height:250px; /* anti CLS */
background:rgba(255,255,255,.05);
border:1px dashed rgba(255,255,255,.1);
border-radius:10px;
margin:12px 0;
}
</style>
</head>
<body>

<div class="card">

<!-- ADS TOP -->
<div class="ads">
<div data-type="_mgwidget" data-widget-id="1878065"></div>
<script>(function(w,q){w[q]=w[q]||[];w[q].push(["_mgc.load"]) })(window,"_mgq");</script>
</div>

<div class="title">🔐 Secure Redirect</div>

<div class="small">
You are being safely redirected...
</div>

<div class="loader"></div>

<div class="progress">
<div class="progress-bar" id="bar"></div>
</div>

<div class="domain" id="domain">Loading link...</div>

<a id="btn" class="btn" target="_blank" rel="nofollow">
🔓 Open Link
</a>

<div class="small">
Redirect in <span class="count" id="count">10</span>s
</div>

<!-- ADS BOTTOM -->
<div class="ads">
<div data-type="_mgwidget" data-widget-id="1882211"></div>
<script>(function(w,q){w[q]=w[q]||[];w[q].push(["_mgc.load"]) })(window,"_mgq");</script>
</div>
</div>
<script>
/* CONFIG */
const REDIRECT_TIME = 10;

/* ELEMENT */
const params = new URLSearchParams(location.search);
const encoded = params.get("url");

const btn = document.getElementById("btn");
const bar = document.getElementById("bar");
const countEl = document.getElementById("count");
const domainEl = document.getElementById("domain");

let targetUrl = null;

/* DECODE */
try{
if(!encoded) throw new Error();

targetUrl = atob(encoded);

const u = new URL(targetUrl);
domainEl.innerText = u.hostname;

btn.href = targetUrl;

}catch{
document.querySelector(".card").innerHTML = "<h2>Invalid Link</h2>";
}

/* TIMER */
let time = REDIRECT_TIME;

const timer = setInterval(()=>{

time--;
countEl.innerText = time;

bar.style.width = ((REDIRECT_TIME - time)/REDIRECT_TIME*100)+"%";

if(time <= 0){
clearInterval(timer);

btn.classList.add("active");
btn.innerText = "🚀 Opening...";

if(targetUrl){
setTimeout(()=>{
window.location.href = targetUrl;
},800);
}
}
},1000);
/* FALLBACK */
setTimeout(()=>{
if(targetUrl){
window.location.href = targetUrl;
}
}, REDIRECT_TIME * 1000);
</script>
</body>
</html>
