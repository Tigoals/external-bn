<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SafeLink Berita Nasional | Pengalihan Aman</title>

<meta name="description" content="Halaman SafeLink untuk mengalihkan pengguna secara aman menuju konten berita nasional terpercaya di Indonesia.">

<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://external.beritanasional.eu.org/">
<meta name="theme-color" content="#0f172a">
<meta name="monetag" content="7ac6e285f325112d2b165132c73e9a72">
<meta property="og:image" content="https://cdn.jsdelivr.net/gh/score808pages/football808@main/image/livescore%20808.png">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/score808pages/football808@main/image/livescore%20808.png">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#0f172a,#111827);
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
color:#111;
}

/* CARD */
.card{
background:#fff;
width:100%;
max-width:420px;
border-radius:16px;
padding:26px;
box-shadow:0 20px 60px rgba(0,0,0,.4);
text-align:center;
position:relative;
overflow:hidden;
}

/* LOADER */
.loader{
width:60px;
height:60px;
border-radius:50%;
border:4px solid #e5e7eb;
border-top:4px solid #2563eb;
animation:spin 1s linear infinite;
margin:20px auto;
}

@keyframes spin{
0%{transform:rotate(0)}
100%{transform:rotate(360deg)}
}

/* PROGRESS BAR */
.progress{
height:6px;
background:#e5e7eb;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#2563eb,#60a5fa);
transition:width .3s ease;
}

/* BUTTON */
.btn{
display:block;
margin-top:18px;
padding:14px;
background:#2563eb;
color:#fff;
border-radius:10px;
text-decoration:none;
font-weight:700;
opacity:.5;
pointer-events:none;
transition:.3s;
}

.btn.active{
opacity:1;
pointer-events:auto;
}

.domain{
font-size:13px;
color:#64748b;
margin-top:10px;
word-break:break-all;
}

.title{
font-size:18px;
font-weight:800;
}

.small{
font-size:13px;
color:#64748b;
line-height:1.5;
margin-top:10px;
}

.count{
font-weight:700;
color:#2563eb;
}
.ads{
background:#f1f5f9;
padding:10px;
border-radius:10px;
font-size:12px;
color:#64748b;
margin:10px 0;
}
</style>
  <script src="https://jsc.mgid.com/site/829703.js" async></script>
</head>

<body>

<div class="card">
<div class="ads">
  <style> div[data-widget-id="1878065"] { min-height: 300px; } </style><div data-type="_mgwidget" data-widget-id="1878065"></div>
<script>(function(w,q){w[q]=w[q]||[];w[q].push(["_mgc.load"])})(window,"_mgq");</script>
</div>
<div class="title">🔐 SafeLink Pro</div>

<div class="small">
Mengalihkan Anda ke halaman tujuan dengan aman...
</div>

<div class="loader"></div>

<div class="progress">
  <div class="progress-bar" id="bar"></div>
</div>

<div class="domain" id="domain">Loading link...</div>

<a id="btn" class="btn" target="_blank" rel="nofollow">
🚀 Klik / Tunggu Redirect
</a>

<div class="small">
Redirect otomatis dalam <span class="count" id="count">10</span> detik
</div>
<div class="ads"><div data-type="_mgwidget" data-widget-id="1882211"></div>
<script>(function(w,q){w[q]=w[q]||[];w[q].push(["_mgc.load"])})(window,"_mgq");</script></div>
</div>

<script>

/* =========================
   CONFIG
========================= */
const REDIRECT_TIME = 10;

/* =========================
   ELEMENT
========================= */
const params = new URLSearchParams(location.search);
const encoded = params.get("url");

const btn = document.getElementById("btn");
const bar = document.getElementById("bar");
const countEl = document.getElementById("count");
const domainEl = document.getElementById("domain");

let targetUrl = null;

/* =========================
   DECODE URL
========================= */
try{

if(!encoded){
  domainEl.innerText = "URL tidak ditemukan";
  throw new Error("no url");
}

targetUrl = atob(encoded);

const u = new URL(targetUrl);
domainEl.innerText = u.hostname;

btn.href = targetUrl;

}catch(e){
document.querySelector(".card").innerHTML =
"<h2>Link tidak valid</h2>";
}

/* =========================
   COUNTDOWN + PROGRESS
========================= */
let time = REDIRECT_TIME;

const timer = setInterval(()=>{

time--;

countEl.innerText = time;

// progress
bar.style.width = ((REDIRECT_TIME - time) / REDIRECT_TIME * 100) + "%";

if(time <= 0){
clearInterval(timer);

btn.classList.add("active");
btn.innerText = "🔄 Redirecting...";

if(targetUrl){
setTimeout(()=>{
window.location.href = targetUrl;
},800);
}

}

},1000);

/* =========================
   AUTO OPEN (optional fallback)
========================= */
setTimeout(()=>{
if(targetUrl){
window.location.href = targetUrl;
}
}, REDIRECT_TIME * 1000);

</script>

</body>
</html>
