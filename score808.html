<script>
const REDIRECT_TIME = 6;

const params = new URLSearchParams(location.search);
const encoded = params.get("url");

const btn = document.getElementById("btn");
const bar = document.getElementById("bar");
const countEl = document.getElementById("count");
const domainEl = document.getElementById("domain");

let targetUrl = null;
let unlocked = false;

try{

if(!encoded) throw new Error();

targetUrl = atob(encoded);

const u = new URL(targetUrl);

domainEl.innerHTML = `
🔒 Secure Domain<br>
<b>${u.hostname}</b>
`;

btn.href = targetUrl;

}catch{

document.querySelector(".card").innerHTML = `
<h2>❌ Invalid Link</h2>
<p>Redirect URL not found.</p>
`;

}

/* COUNTDOWN */

let time = REDIRECT_TIME;

const timer = setInterval(()=>{

time--;

countEl.textContent = time;

const percent =
((REDIRECT_TIME - time) / REDIRECT_TIME) * 100;

bar.style.width = percent + "%";

if(time <= 0){

clearInterval(timer);

unlockButton();

}

},1000);

/* UNLOCK BUTTON */

function unlockButton(){

unlocked = true;

btn.classList.add("active");

btn.innerHTML = `
<svg class="btn-icon" viewBox="0 0 24 24" fill="none">
  <path d="M7 11V7a5 5 0 0 1 10 0"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"/>
  <rect x="4" y="11" width="16" height="9" rx="3"
        stroke="currentColor"
        stroke-width="2"/>
  <path d="M12 14v3"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"/>
</svg>
<span>Open Secure Link</span>
`;

btn.style.animation =
"pulse 1.2s infinite";

btn.scrollIntoView({
behavior:"smooth",
block:"center"
});

createConfetti();

}

/* CLICK ACTION */

/* CLICK ACTION */

btn.addEventListener("click",(e)=>{

  if(!unlocked){
    e.preventDefault();
    return;
  }

  createRipple(e);

  btn.innerHTML = "🚀 Opening...";

  // biarkan link <a href=""> bekerja normal
  // tanpa redirect javascript

});

/* RIPPLE EFFECT */

function createRipple(e){

const ripple =
document.createElement("span");

const rect =
btn.getBoundingClientRect();

const size =
Math.max(rect.width,rect.height);

ripple.style.cssText=`
position:absolute;
width:${size}px;
height:${size}px;
left:${e.clientX-rect.left-size/2}px;
top:${e.clientY-rect.top-size/2}px;
background:rgba(255,255,255,.5);
border-radius:50%;
transform:scale(0);
animation:ripple .6s linear;
pointer-events:none;
`;

btn.appendChild(ripple);

setTimeout(()=>{
ripple.remove();
},600);

}

/* CONFETTI */

function createConfetti(){

for(let i=0;i<30;i++){

const c =
document.createElement("div");

c.style.cssText=`
position:fixed;
left:${Math.random()*100}vw;
top:-20px;
width:8px;
height:8px;
background:hsl(${Math.random()*360}deg 100% 60%);
z-index:9999;
border-radius:50%;
animation:fall ${2+Math.random()*2}s linear forwards;
`;

document.body.appendChild(c);

setTimeout(()=>{
c.remove();
},4000);

}

}
</script>
